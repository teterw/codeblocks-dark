    <text x="39.2" y="90" fill="#ffffff" xml:space="preserve"> main</text>
    <text x="81.2" y="90" fill="#a6e22e" xml:space="preserve">() {</text>
    <text x="14.0" y="110" fill="#ffffff" xml:space="preserve">    printf</text>
