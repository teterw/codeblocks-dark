  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="14.0" y="30" fill="#f92672" xml:space="preserve">#include &lt;stdio.h&gt;</text>
    <text x="14.0" y="70" fill="#75715e" xml:space="preserve">// dark mode, finally</text>
