<svg xmlns="http://www.w3.org/2000/svg" width="280" height="172"
     viewBox="0 0 280 172" role="img" aria-label="Vim theme preview">
  <title>Vim</title>
  <rect width="280" height="172" rx="8" fill="#000000"/>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="14.0" y="30" fill="#0000ff" xml:space="preserve">#include &lt;stdio.h&gt;</text>
    <text x="14.0" y="70" fill="#80ffff" xml:space="preserve">// dark mode, finally</text>
    <text x="14.0" y="90" fill="#00ff00" xml:space="preserve">int</text>
    <text x="39.2" y="90" fill="#c0c0c0" xml:space="preserve"> main</text>
    <text x="81.2" y="90" fill="#ffffff" xml:space="preserve">() {</text>
    <text x="14.0" y="110" fill="#c0c0c0" xml:space="preserve">    printf</text>
    <text x="98.0" y="110" fill="#ffffff" xml:space="preserve">(</text>
    <text x="106.4" y="110" fill="#ff00ff" xml:space="preserve">"hello"</text>
    <text x="165.2" y="110" fill="#ffffff" xml:space="preserve">);</text>
    <text x="14.0" y="130" fill="#00ff00" xml:space="preserve">    return</text>
    <text x="98.0" y="130" fill="#ff00ff" xml:space="preserve"> 0</text>
    <text x="114.8" y="130" fill="#ffffff" xml:space="preserve">;</text>
    <text x="14.0" y="150" fill="#ffffff" xml:space="preserve">}</text>
  </g>
</svg>
